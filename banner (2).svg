<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0B0F"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="traceCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DE2E6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DE2E6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2DE2E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tracePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3DAA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3DAA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF3DAA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- animated circuit traces -->
  <path id="trace1" d="M -200 60 C 200 20, 400 140, 700 80 S 1100 40, 1400 100"
        stroke="#2DE2E6" stroke-width="1.5" fill="none" opacity="0.55" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path id="trace2" d="M -200 260 C 150 300, 450 180, 750 250 S 1150 300, 1400 220"
        stroke="#FF3DAA" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M -200 160 C 250 120, 500 210, 800 150 S 1150 120, 1400 170"
        stroke="#7C5CFF" stroke-width="1" fill="none" opacity="0.3" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- traveling light pulses along traces -->
  <circle r="4" fill="#2DE2E6" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M -200 60 C 200 20, 400 140, 700 80 S 1100 40, 1400 100"/>
  </circle>
  <circle r="4" fill="#FF3DAA" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M -200 260 C 150 300, 450 180, 750 250 S 1150 300, 1400 220"/>
  </circle>

  <!-- keycap silhouette accents -->
  <g opacity="0.9">
    <rect x="70" y="230" width="30" height="30" rx="6" fill="#15161C" stroke="#2DE2E6" stroke-width="1">
      <animate attributeName="y" values="230;224;230" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1100" y="60" width="26" height="26" rx="6" fill="#15161C" stroke="#FF3DAA" stroke-width="1">
      <animate attributeName="y" values="60;54;60" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="72" letter-spacing="14" fill="#F5F5F7" filter="url(#glow)">
    PHANTOM
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- tagline -->
  <text x="600" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" letter-spacing="4" fill="#9AA0AC">
    PRECISION&#160;&#160;&#8226;&#160;&#160;PERFECTED
    <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
  </text>
</svg>
